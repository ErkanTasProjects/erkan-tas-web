<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı - 404</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; flex-direction: column;">

  <h1 class="et-hero-title" style="font-size: 6rem; margin-bottom: 0;">404</h1>
  <p class="et-p" style="font-size: 1.5rem; margin-bottom: 2rem;">Aradığınız sayfa bulunamadı veya taşınmış olabilir.</p>
  <a href="/" class="btn et-btn-primary">Anasayfaya Dön</a>

<script>
  let saved = null;
  try { saved = localStorage.getItem('et_theme'); } catch (e) { }
  const initial = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', initial);
</script>
</body>
</html>
